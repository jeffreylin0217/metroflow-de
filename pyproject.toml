[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "metroflow-de"
version = "0.1.0"
description = "Incremental NYC mobility batch pipeline with Python, Parquet, DuckDB and dbt"
requires-python = ">=3.11,<3.14"
dependencies = ["dbt-core>=1.10,<1.11", "dbt-duckdb==1.10.1", "pyarrow>=19", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["metroflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
