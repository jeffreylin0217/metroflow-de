[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "metroflow-de"
version = "0.1.0"
description = "Incremental NYC mobility batch pipeline with Python, Parquet, DuckDB and dbt"
requires-python = ">=3.11"
dependencies = ["dbt-duckdb>=1.9,<2", "pyarrow>=19", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["metroflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
